name: Generate 3D Snake Animation

on:
  schedule: # dieksekusi setiap 12 jam
    - cron: "0 */12 * * *"
  
  workflow_dispatch:
  
  push:
    branches:
    - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pyyaml
          
      - name: Generate GitHub contribution data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python generate_3d_snake.py
          
      - name: Generate 3D snake animation
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-3d.svg?color_snake=linear-gradient(90deg,#7c3aed,#3b82f6,#06b6d4)&color_dots=#1e293b,#334155,#475569,#64748b,#94a3b8&color_bg=0d1117&animation_duration=20&animation_hide_independent_cells=false&animation_loop=true
            dist/snake-dark.svg?palette=github-dark&color_snake=linear-gradient(90deg,#3b82f6,#06b6d4)&animation_duration=15
            dist/snake-neon.svg?color_snake=neon&color_dots=#0f172a,#1e293b,#334155&color_bg=000000&animation_duration=25
            dist/snake-synthwave.svg?color_snake=linear-gradient(90deg,#f0abfc,#d946ef,#7c3aed)&color_dots=#1e1b4b,#312e81,#4338ca&color_bg=0f172a&animation_duration=20
          
      - name: Apply 3D effects to SVG
        run: |
          python apply_3d_effects.py
          
      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Update README preview
        run: |
          # Update README dengan preview terbaru
          sed -i 's|<!-- SNAKE:START -->.*<!-- SNAKE:END -->|<!-- SNAKE:START -->\n![3D Snake Animation](https://raw.githubusercontent.com/${{ github.repository_owner }}/${{ github.repository_owner }}/output/snake-3d.svg)\n<!-- SNAKE:END -->|' README.md
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add README.md
          git commit -m "Update snake animation preview" || exit 0
          git push
